<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Iuran Perumahan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        :root {
            --hijau: #34c759;
            --merah: #ff3b30;
            --biru: #007aff;
            --oranye: #ff9500;
            --abu: #e5e5e7;
            --gelap: #1d1d1f;
            --putih: #ffffff;
            --latar: #f2f2f7;
        }
        body { background: var(--latar); padding: 16px; max-width: 960px; margin: 0 auto; }
        
        .header { background: var(--putih); padding: 20px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px; }
        h1 { font-size: 20px; color: var(--gelap); margin-bottom: 16px; font-weight: 700; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        select { padding: 10px 14px; border-radius: 10px; border: 1px solid #d1d1d6; font-size: 15px; background: var(--putih); min-width: 180px; }
        .legend { display: flex; gap: 20px; font-size: 14px; }
        .legend span { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.paid { background: var(--hijau); box-shadow: 0 0 0 2px rgba(52,199,89,0.2); }
        .dot.unpaid { background: var(--merah); box-shadow: 0 0 0 2px rgba(255,59,48,0.2); }

        .tabs { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .tab {
            padding: 12px 24px; border-radius: 12px 12px 0 0; background: var(--abu); border: none;
            cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.2s ease;
        }
        .tab:hover { background: #d1d1d6; }
        .tab.active { background: var(--putih); box-shadow: 0 -3px 0 var(--biru); color: var(--biru); }

        /* ✅ GRID 5 KOLOM × 10 BARIS — KOTAK LEBIH BESAR */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 kolom tetap */
            gap: 12px; /* Jarak antar kotak lebih renggang */
        }
        .box {
            background: var(--putih); border-radius: 12px; padding: 18px 10px; /* Lebih tinggi */
            text-align: center; cursor: pointer; border: 2px solid transparent;
            transition: all 0.25s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            min-height: 80px; /* Ukuran minimal kotak diperbesar */
        }
        .box:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .box.unpaid { background: #fff2f2; border-color: var(--merah); }
        .box.paid { background: #f2fff4; border-color: var(--hijau); }
        .box .id { font-size: 20px; font-weight: 700; margin-bottom: 6px; } /* Tulisan lebih besar */
        .box .date { font-size: 13px; color: #636366; } /* Tanggal lebih jelas */

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
            align-items: center; justify-content: center; padding: 20px; z-index: 999; backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--putih); padding: 28px; border-radius: 20px; width: 100%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .modal-content h3 { margin-bottom: 20px; font-size: 17px; font-weight: 600; }
        input[type="date"], input[type="password"] {
            width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer;
            font-weight: 600; transition: transform 0.15s;
        }
        button:active { transform: scale(0.97); }
        .btn-cancel { background: var(--abu); color: var(--gelap); }
        .btn-save { background: var(--biru); color: #fff; }
        .btn-delete { background: var(--merah); color: #fff; margin-top: 10px; width: 100%; }
        .btn-pass-ok { background: var(--biru); color: #fff; margin-top: 8px; width: 100%; }

        .footer { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
        .footer button { flex: 1; min-width: 170px; background: var(--gelap); color: #fff; }
        .btn-reset-blok { background: var(--oranye); color: #fff; }
        .btn-reset-semua { background: var(--merah); color: #fff; }

        .stat-bar { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; flex-wrap: wrap; }
        .stat-item { font-size: 14px; }
        .stat-item b { color: var(--biru); }

        /* Di HP tetap 5 kolom, sedikit disesuaikan */
        @media (max-width: 480px) {
            .grid { gap: 8px; }
            .box { padding: 14px 6px; min-height: 70px; }
            .box .id { font-size: 17px; }
            .box .date { font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏠 Pencatatan Iuran Perumahan</h1>
    <div class="top-bar">
        <label>Periode Bulan:
            <select id="monthSelect"></select>
        </label>
        <div class="legend">
            <span><span class="dot paid"></span> Sudah Bayar</span>
            <span><span class="dot unpaid"></span> Belum Bayar</span>
        </div>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-blok="A">Blok A</button>
        <button class="tab" data-blok="B">Blok B</button>
        <button class="tab" data-blok="C">Blok C</button>
        <button class="tab" data-blok="D">Blok D</button>
    </div>

    <div class="stat-bar">
        <div class="stat-item">Sudah bayar: <b id="jmlSudah">0</b> / 50</div>
        <div class="stat-item">Belum bayar: <b id="jmlBelum">0</b> / 50</div>
    </div>
</div>

<div class="grid" id="gridContainer"></div>

<!-- Modal Pilih Tanggal -->
<div class="modal" id="modalBayar">
    <div class="modal-content">
        <h3 id="modalJudul">Pilih Tanggal Bayar</h3>
        <input type="date" id="tglBayar">
        <div class="btn-group">
            <button class="btn-cancel" id="btnBatal">Batal</button>
            <button class="btn-save" id="btnSimpan">Simpan</button>
        </div>
        <button class="btn-delete" id="btnHapus">Hapus Status Bayar</button>
    </div>
</div>

<!-- Modal Masukkan Kata Sandi -->
<div class="modal" id="modalSandi">
    <div class="modal-content">
        <h3>🔐 Masukkan Kata Sandi</h3>
        <input type="password" id="inputSandi" placeholder="Kata sandi: 12345">
        <div class="btn-group">
            <button class="btn-cancel" id="btnBatalSandi">Batal</button>
            <button class="btn-pass-ok" id="btnKonfirmasi">Konfirmasi</button>
        </div>
    </div>
</div>

<div class="footer">
    <button id="btnSelesai">✅ Selesai / Segarkan</button>
    <button id="btnUrung" class="btn-reset-blok">⚠️ Urungkan Blok Ini</button>
    <button id="btnResetSemua" class="btn-reset-semua">❌ Reset SEMUA Data</button>
</div>

<script>
const KATA_SANDI = "12345";

const monthSelect = document.getElementById('monthSelect');
const tabsContainer = document.getElementById('tabs');
const gridContainer = document.getElementById('gridContainer');
const modalBayar = document.getElementById('modalBayar');
const modalSandi = document.getElementById('modalSandi');
const tglBayar = document.getElementById('tglBayar');
const inputSandi = document.getElementById('inputSandi');
const btnBatal = document.getElementById('btnBatal');
const btnSimpan = document.getElementById('btnSimpan');
const btnHapus = document.getElementById('btnHapus');
const btnSelesai = document.getElementById('btnSelesai');
const btnUrung = document.getElementById('btnUrung');
const btnResetSemua = document.getElementById('btnResetSemua');
const btnBatalSandi = document.getElementById('btnBatalSandi');
const btnKonfirmasi = document.getElementById('btnKonfirmasi');
const modalJudul = document.getElementById('modalJudul');
const jmlSudahEl = document.getElementById('jmlSudah');
const jmlBelumEl = document.getElementById('jmlBelum');

let currentBlok = 'A';
let currentIndex = null;
let tindakanLulus = null;
let payments = {};

function muatData() {
    const simpanan = localStorage.getItem('dataIuran');
    if (simpanan) payments = JSON.parse(simpanan);
}
function simpanData() {
    localStorage.setItem('dataIuran', JSON.stringify(payments));
}

function isiPilihanBulan() {
    const daftarBulan = [];
    const sekarang = new Date();
    for (let thn = sekarang.getFullYear() - 1; thn <= sekarang.getFullYear() + 1; thn++) {
        for (let bln = 1; bln <= 12; bln++) {
            daftarBulan.push(`${thn}-${String(bln).padStart(2,'0')}`);
        }
    }
    monthSelect.innerHTML = daftarBulan.map(kode => {
        const [thn, bln] = kode.split('-');
        const namaBulan = new Date(thn, bln - 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
        return `<option value="${kode}">${namaBulan}</option>`;
    }).join('');
    const kodeSekarang = `${sekarang.getFullYear()}-${String(sekarang.getMonth() + 1).padStart(2,'0')}`;
    monthSelect.value = kodeSekarang;
}

tabsContainer.addEventListener('click', e => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentBlok = e.target.dataset.blok;
    tampilkanGrid();
});

function tampilkanGrid() {
    gridContainer.innerHTML = '';
    const periode = monthSelect.value;
    let sudah = 0, belum = 0;

    for (let no = 1; no <= 50; no++) {
        const kunci = `${periode}-${currentBlok}${no}`;
        const info = payments[kunci];
        info ? sudah++ : belum++;

        const kotak = document.createElement('div');
        kotak.className = `box ${info ? 'paid' : 'unpaid'}`;
        kotak.innerHTML = `
            <div class="id">${currentBlok}${no}</div>
            <div class="date">${info ? info.tanggal : 'Belum'}</div>
        `;
        kotak.addEventListener('click', () => bukaModalBayar(no, periode));
        gridContainer.appendChild(kotak);
    }

    jmlSudahEl.textContent = sudah;
    jmlBelumEl.textContent = belum;
}

function bukaModalBayar(no, periode) {
    currentIndex = { no, periode };
    const kunci = `${periode}-${currentBlok}${no}`;
    modalJudul.textContent = `${currentBlok}${no} — Pilih Tanggal Bayar`;
    tglBayar.value = payments[kunci]?.tanggal || '';
    modalBayar.classList.add('show');
}

btnBatal.addEventListener('click', () => modalBayar.classList.remove('show'));

btnSimpan.addEventListener('click', () => {
    if (!tglBayar.value) {
        alert('Silakan pilih tanggal!');
        return;
    }
    const kunci = `${currentIndex.periode}-${currentBlok}${currentIndex.no}`;
    payments[kunci] = { tanggal: tglBayar.value };
    simpanData();
    tampilkanGrid();
    modalBayar.classList.remove('show');
});

btnHapus.addEventListener('click', () => {
    if (!confirm('Yakin hapus status pembayaran ini?')) return;
    const kunci = `${currentIndex.periode}-${currentBlok}${currentIndex.no}`;
    delete payments[kunci];
    simpanData();
    tampilkanGrid();
    modalBayar.classList.remove('show');
});

monthSelect.addEventListener('change', tampilkanGrid);
btnSelesai.addEventListener('click', () => location.reload());

// Proteksi Kata Sandi
function bukaKataSandi(tindakan) {
    tindakanLulus = tindakan;
    inputSandi.value = '';
    modalSandi.classList.add('show');
}

btnBatalSandi.addEventListener('click', () => {
    modalSandi.classList.remove('show');
    tindakanLulus = null;
});

btnKonfirmasi.addEventListener('click', () => {
    if (inputSandi.value === KATA_SANDI) {
        modalSandi.classList.remove('show');
        lanjutkanTindakan();
    } else {
        alert('❌ Kata sandi salah! Coba lagi.');
        inputSandi.value = '';
        inputSandi.focus();
    }
});

function lanjutkanTindakan() {
    if (!tindakanLulus) return;
    const periode = monthSelect.value;

    if (tindakanLulus === 'resetBlok') {
        if (!confirm(`⚠️ Yakin URUNGKAN semua data Blok ${currentBlok} bulan ini?`)) return;
        for (let no = 1; no <= 50; no++) {
            delete payments[`${periode}-${currentBlok}${no}`];
        }
        simpanData();
        tampilkanGrid();
        alert(`✅ Blok ${currentBlok} sudah dikembalikan ke Belum Bayar`);
    }

    if (tindakanLulus === 'resetSemua') {
        if (!confirm('⚠️ PERINGATAN!\nIni akan MENGHAPUS SEMUA data seluruh blok & bulan!')) return;
        if (!confirm('Yakin BENAR-BENAR hapus SEMUA? Tidak bisa dikembalikan!')) return;
        payments = {};
        localStorage.removeItem('dataIuran');
        tampilkanGrid();
        alert('✅ Semua data sudah dihapus');
    }
    tindakanLulus = null;
}

btnUrung.addEventListener('click', () => bukaKataSandi('resetBlok'));
btnResetSemua.addEventListener('click', () => bukaKataSandi('resetSemua'));

muatData();
isiPilihanBulan();
tampilkanGrid();
</script>

</body>
</html>
