<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iuran Perumahan Paradise Residence 4</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subcard: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --input-bg: #ffffff;
    }

    body.dark {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-subcard: #334155;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --border-color: #334155;
      --input-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 40px; }

    /* Top Bar Header */
    .top-bar { max-width: 600px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .top-bar-left, .top-bar-right { display: flex; gap: 8px; align-items: center; }
    
    .badge-user { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    
    .btn-top { border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-dark-toggle { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-refresh { background: #2563eb; color: #ffffff; }
    .btn-logout { background: #ef4444; color: #ffffff; }
    .btn-settings { background: #475569; color: #ffffff; border-radius: 50%; width: 32px; height: 32px; justify-content: center; font-size: 14px; }

    /* Main Container */
    .app-container { max-width: 600px; margin: 0 auto; padding: 0 16px; }

    /* Banner Banner Header */
    .hero-banner { background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff; padding: 20px 16px; border-radius: 16px; text-align: center; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    .hero-banner h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
    .hero-banner h2 { font-size: 14px; font-weight: 700; margin-top: 2px; text-transform: uppercase; }
    .hero-banner p { font-size: 11px; opacity: 0.9; margin-top: 4px; }
    .badge-status { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 11px; margin-top: 10px; font-weight: 600; }

    /* Controls & Tabs Card */
    .control-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .period-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .period-row label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .period-row input { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; outline: none; }
    
    .legend-box { display: flex; gap: 12px; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }

    /* Tabs */
    .tab-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; min-width: 70px; border: none; background: var(--bg-subcard); color: var(--text-muted); padding: 10px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #ffffff; color: #2563eb; border: 2px solid #2563eb; }
    body.dark .tab-btn.active { background: #1e293b; color: #38bdf8; border-color: #38bdf8; }

    .summary-text { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .summary-text span.green { color: #22c55e; }
    .summary-text span.blue { color: #2563eb; }
    body.dark .summary-text span.blue { color: #38bdf8; }

    /* Grid Rumah */
    .grid-houses { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .house-box {
      border-radius: 12px;
      padding: 10px 2px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 65px;
      user-select: none;
    }
    .house-box:active { transform: scale(0.95); }

    /* Style Belum Bayar */
    .house-box.red { border: 1.5px solid #fca5a5; background-color: #fef2f2; }
    .house-box.red .num { font-size: 15px; font-weight: 800; color: #0f172a; }
    .house-box.red .status { font-size: 9px; color: #991b1b; font-weight: 600; margin-top: 2px; }

    body.dark .house-box.red { border-color: #991b1b; background-color: #451a1a; }
    body.dark .house-box.red .num { color: #ffffff; }
    body.dark .house-box.red .status { color: #fca5a5; }

    /* Style Lunas */
    .house-box.green { border: 1.5px solid #86efac; background-color: #f0fdf4; }
    .house-box.green .num { font-size: 15px; font-weight: 800; color: #0f172a; }
    .house-box.green .status { font-size: 9px; color: #166534; font-weight: 700; margin-top: 2px; }

    body.dark .house-box.green { border-color: #166534; background-color: #143821; }
    body.dark .house-box.green .num { color: #ffffff; }
    body.dark .house-box.green .status { color: #86efac; }

    /* Modal Overlay */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { background: var(--bg-card); color: var(--text-main); width: 100%; max-width: 380px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--border-color); }
    .modal-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .modal-card label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
    .modal-card input, .modal-card select { width: 100%; padding: 10px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; }
    
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .btn { padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-save { background: #22c55e; color: #ffffff; }
    .btn-reset { background: #fee2e2; color: #dc2626; }
    body.dark .btn-reset { background: #451a1a; color: #fca5a5; }
    .btn-cancel { background: var(--bg-subcard); color: var(--text-muted); }

    /* User List Table in Settings */
    .user-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 12px; }
    .user-table th, .user-table td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
    .user-table th { background: var(--bg-subcard); color: var(--text-main); }
    .btn-del { background: #ef4444; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="badge-user">
        👤 <span id="displayUser">Administrator</span>
      </div>
    </div>
    <div class="top-bar-right">
      <button class="btn-top btn-dark-toggle" onclick="toggleDarkMode()">
        <span id="darkIcon">🌙</span> <span id="darkText">Gelap</span>
      </button>
      <button class="btn-top btn-refresh" onclick="renderGrid()">Segarkan</button>
      <button class="btn-top btn-logout" onclick="logout()">Keluar</button>
      <!-- Tombol Gear Pengaturan Khusus Admin -->
      <button id="btnGear" class="btn-top btn-settings" onclick="openSettingsModal()" style="display: none;" title="Pengaturan Petugas">⚙️</button>
    </div>
  </div>

  <div class="app-container">
    <!-- Hero Banner -->
    <div class="hero-banner">
      <h1>Iuran Rutin</h1>
      <h2>Perumahan Paradise Residence 4</h2>
      <p>JL. HAJI UMAR — KAMPAK — PANGKALPINANG</p>
      <div class="badge-status">✓ Terhubung & Terbaru</div>
    </div>

    <!-- Controls -->
    <div class="control-card">
      <div class="period-row">
        <label for="monthPicker">Periode:</label>
        <input type="month" id="monthPicker">
        <div class="legend-box">
          <div class="legend-item"><span class="dot dot-green"></span> Sudah</div>
          <div class="legend-item"><span class="dot dot-red"></span> Belum</div>
        </div>
      </div>

      <!-- Tab Blok -->
      <div class="tab-container" id="tabContainer"></div>

      <!-- Summary -->
      <div class="summary-text" id="summaryText">Sudah: 0/50 &nbsp; Belum: 50/50</div>
    </div>

    <!-- Grid 50 Rumah -->
    <div class="grid-houses" id="gridContainer"></div>
  </div>

  <!-- Modal Pilih Tanggal Bayar -->
  <div id="paymentModal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modalTitle">Rumah A1</h3>
      <label for="payDate">Tanggal Bayar:</label>
      <input type="date" id="payDate">

      <div class="btn-group">
        <button class="btn btn-save" onclick="savePayment()">Simpan (Set Lunas)</button>
        <button id="btnReset" class="btn btn-reset" onclick="resetPayment()">Batal Lunas (Set Belum)</button>
        <button class="btn btn-cancel" onclick="closeModal('paymentModal')">Batal</button>
      </div>
    </div>
  </div>

  <!-- Modal Pengaturan Akun Petugas (Khusus Admin) -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ Pengaturan Akun Petugas</h3>
      
      <!-- Tabel Akun -->
      <table class="user-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>

      <!-- Form Tambah/Ubah User -->
      <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px;">
        <label for="newUsername">Username Baru / Edit:</label>
        <input type="text" id="newUsername" placeholder="Contoh: Petugas Blok C">

        <label for="newPassword">Password:</label>
        <input type="password" id="newPassword" placeholder="Masukkan password">

        <label for="newRole">Role Akses:</label>
        <select id="newRole">
          <option value="Petugas">Petugas</option>
          <option value="Administrator">Administrator</option>
        </select>

        <div class="btn-group">
          <button class="btn btn-save" onclick="saveUser()">Simpan Akun</button>
          <button class="btn btn-cancel" onclick="closeModal('settingsModal')">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Data Pengguna Bawaan
    const defaultUsers = [
      { username: 'Administrator', password: 'adminpassword', role: 'Administrator' },
      { username: 'Petugas Blok A', password: 'user123', role: 'Petugas' },
      { username: 'Petugas Blok B', password: 'user123', role: 'Petugas' }
    ];

    let users = JSON.parse(localStorage.getItem('iuran_users')) || defaultUsers;
    let currentUser = JSON.parse(sessionStorage.getItem('current_user')) || { username: 'Administrator', role: 'Administrator' };

    // Data Rumah
    const HOUSING_DATA = {
      'Blok A': Array.from({ length: 50 }, (_, i) => `A${i + 1}`),
      'Blok B': Array.from({ length: 50 }, (_, i) => `B${i + 1}`),
      'Blok C': Array.from({ length: 50 }, (_, i) => `C${i + 1}`),
      'Blok D': Array.from({ length: 50 }, (_, i) => `D${i + 1}`)
    };

    let activeBlock = 'Blok A';
    let records = JSON.parse(localStorage.getItem('iuran_data') || '{}');
    let selectedHouse = null;

    const monthPicker = document.getElementById('monthPicker');
    const today = new Date();
    monthPicker.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

    document.addEventListener('DOMContentLoaded', () => {
      // Set Mode Gelap jika sebelumnya aktif
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('darkIcon').innerText = '☀️';
        document.getElementById('darkText').innerText = 'Terang';
      }

      // Check Role User
      document.getElementById('displayUser').innerText = currentUser.username;
      if (currentUser.role === 'Administrator') {
        document.getElementById('btnGear').style.display = 'flex';
      }

      renderTabs();
      renderGrid();
      monthPicker.addEventListener('change', renderGrid);
    });

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('darkIcon').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('darkText').innerText = isDark ? 'Terang' : 'Gelap';
    }

    // Tabs
    function renderTabs() {
      const container = document.getElementById('tabContainer');
      container.innerHTML = '';
      Object.keys(HOUSING_DATA).forEach(block => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${block === activeBlock ? 'active' : ''}`;
        btn.innerText = block;
        btn.onclick = () => { activeBlock = block; renderTabs(); renderGrid(); };
        container.appendChild(btn);
      });
    }

    // Grid Rumah
    function renderGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';
      const period = monthPicker.value;

      let paidCount = 0;
      const houses = HOUSING_DATA[activeBlock];

      houses.forEach(houseNum => {
        const key = `${period}_${activeBlock}_${houseNum}`;
        const data = records[key];
        const isPaid = !!data;

        if (isPaid) paidCount++;

        const box = document.createElement('div');
        box.className = `house-box ${isPaid ? 'green' : 'red'}`;
        box.onclick = () => openModal('paymentModal', houseNum, isPaid, data ? data.date : null);

        box.innerHTML = `
          <div class="num">${houseNum}</div>
          <div class="status">${isPaid ? formatDate(data.date) : 'Belum Bayar'}</div>
        `;

        container.appendChild(box);
      });

      // Update Summary
      document.getElementById('summaryText').innerHTML = `
        Sudah: <span class="green">${paidCount}/${houses.length}</span> &nbsp; 
        Belum: <span class="blue">${houses.length - paidCount}/${houses.length}</span>
      `;
    }

    // Payment Modal
    function openModal(modalId, houseNum, isPaid, date) {
      selectedHouse = houseNum;
      document.getElementById('modalTitle').innerText = `Rumah ${houseNum} (${activeBlock})`;
      document.getElementById('payDate').value = date || new Date().toISOString().split('T')[0];
      document.getElementById('btnReset').style.display = isPaid ? 'block' : 'none';
      document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function savePayment() {
      const date = document.getElementById('payDate').value;
      if (!date) return alert('Pilih tanggal pembayaran!');
      const key = `${monthPicker.value}_${activeBlock}_${selectedHouse}`;
      records[key] = { status: true, date: date };
      localStorage.setItem('iuran_data', JSON.stringify(records));
      closeModal('paymentModal');
      renderGrid();
    }

    function resetPayment() {
      const key = `${monthPicker.value}_${activeBlock}_${selectedHouse}`;
      delete records[key];
      localStorage.setItem('iuran_data', JSON.stringify(records));
      closeModal('paymentModal');
      renderGrid();
    }

    // Settings Modal & User Management
    function openSettingsModal() {
      renderUserTable();
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function renderUserTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';
      users.forEach((u, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${u.username}</strong></td>
          <td>${u.role}</td>
          <td>
            <button class="btn-del" onclick="deleteUser(${index})">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function saveUser() {
      const uInput = document.getElementById('newUsername').value.trim();
      const pInput = document.getElementById('newPassword').value.trim();
      const rInput = document.getElementById('newRole').value;

      if (!uInput || !pInput) return alert('Username dan password wajib diisi!');

      const existingIndex = users.findIndex(u => u.username === uInput);
      if (existingIndex >= 0) {
        users[existingIndex] = { username: uInput, password: pInput, role: rInput };
      } else {
        users.push({ username: uInput, password: pInput, role: rInput });
      }

      localStorage.setItem('iuran_users', JSON.stringify(users));
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      renderUserTable();
      alert('Data akun berhasil disimpan!');
    }

    function deleteUser(index) {
      if (users[index].username === 'Administrator') {
        return alert('Akun Administrator utama tidak boleh dihapus!');
      }
      if (confirm(`Hapus akun ${users[index].username}?`)) {
        users.splice(index, 1);
        localStorage.setItem('iuran_users', JSON.stringify(users));
        renderUserTable();
      }
    }

    function logout() {
      alert('Berhasil keluar.');
      // Untuk demo, reset kembali ke administrator
      sessionStorage.setItem('current_user', JSON.stringify({ username: 'Administrator', role: 'Administrator' }));
      location.reload();
    }

    function formatDate(str) {
      if (!str) return 'Lunas';
      const p = str.split('-');
      return `${p[2]}/${p[1]}`;
    }
  </script>
</body>
</html>
